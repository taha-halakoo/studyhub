version: 2
updates:
  # package.json lives in main/, not at the repository root.
  - package-ecosystem: npm
    directory: "/main"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
