version: 2
updates:
  # package.json lives in main/, not at the repository root.
  # No github-actions entry: this repository has no workflows, and Dependabot
  # aborts the entire run when a configured ecosystem has nothing to scan.
  - package-ecosystem: npm
    directory: "/main"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
